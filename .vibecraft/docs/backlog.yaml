phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы — комната бабушки
    description:
      "Создать главную страницу приложения в стиле hygge: тёплая комната
      с деревянными текстурами, пастельными тонами, вязаными элементами. Бабушка
      сидит в кресле, на стене — газетные вырезки (пока статические заглушки).
      Это первый визуальный результат, который пользователь увидит сразу."
    priority: high
    acceptance_criteria:
      - Главная страница отображается в стиле скандинавского уюта
      - На странице есть изображение/иллюстрация бабушки в кресле
      - Газетные вырезки отображаются как статические заглушки
      - Интерфейс интуитивно понятен
    depends_on: []
    related_feature: Чтение новостей по интересам
    status: completed
    summary: "Главная страница переработана в стиле hygge: тёплая цветовая гамма
      (бежевый, терракота, золотистый), деревянный пол с текстурой, вязаные
      элементы (шаль бабушки, коврик). Добавлена SVG-иллюстрация бабушки в
      кресле с вязанием, чашкой чая и лампой. На стене — 4 статические газетные
      вырезки на финском языке с заголовками и краткими текстами. Окно с
      занавесками, комнатное растение, картина на стене. Основная реализация в
      компонентах components/room-scene.tsx, components/grandma-svg.tsx,
      components/newspaper-clippings.tsx."
  - id: task-002
    phase: mvp
    title: Аутентификация пользователей через Supabase
    description:
      Добавить регистрацию и вход через Supabase Auth (email/password).
      Пользователь может создать аккаунт, войти и выйти. Все данные привязаны к
      аккаунту.
    priority: high
    acceptance_criteria:
      - Пользователь может зарегистрироваться с email и паролем
      - Пользователь может войти в существующий аккаунт
      - Пользователь может выйти из аккаунта
      - Неавторизованный пользователь видит страницу входа
    depends_on:
      - task-001
    related_feature: Чтение новостей по интересам
    status: completed
    summary: "Реализована аутентификация через Supabase Auth (email/password).
      Созданы: Supabase-клиенты (lib/supabase.ts, lib/supabase-client.ts),
      middleware (middleware.ts), API-роуты (/api/auth/register,
      /api/auth/login, /api/auth/logout, /api/auth/me), страница входа (/login)
      с формой логина/регистрации (components/login-form.tsx), компонент статуса
      аутентификации в хедере (components/auth-status.tsx). Неавторизованные
      пользователи перенаправляются на /login."
  - id: task-003
    phase: mvp
    title: Настройка тем новостей
    description: Добавить страницу настроек, где пользователь выбирает категории
      новостей (политика, спорт, культура, погода, технологии, здоровье,
      экономика) через чекбоксы. Выбор сохраняется в Supabase и привязан к
      аккаунту.
    priority: high
    acceptance_criteria:
      - В настройках есть список категорий с чекбоксами
      - Выбор сохраняется в базе данных
      - При повторном входе настройки восстанавливаются
    depends_on:
      - task-002
    related_feature: Настройка тем новостей
    status: completed
    summary: Добавлена страница /settings со списком из 7 категорий (политика,
      спорт, культура, погода, технологии, здоровье, экономика) и чекбоксами.
      Выбор сохраняется в DynamoDB через API /api/preferences (GET/PUT),
      привязан к userId из Supabase Auth. Компонент settings-form.tsx — форма с
      чекбоксами на клиенте, иконка настроек в шапке (auth-status.tsx).
      Категории заведены как константы в lib/constants.ts для переиспользования
      в task-004.
  - id: task-004
    phase: mvp
    title: Загрузка и отображение реальных новостей из NewsAPI
    description: Подключить NewsAPI для получения свежих финских новостей по
      выбранным категориям. Новости отображаются как газетные вырезки на стене в
      комнате бабушки. Каждая карточка содержит заголовок, краткое содержание и
      ссылку на оригинал.
    priority: high
    acceptance_criteria:
      - Новости подгружаются из NewsAPI по выбранным категориям
      - Каждая новость отображается как карточка-вырезка
      - Карточка содержит заголовок, краткое содержание и ссылку на оригинал
      - При клике на новость открывается подробный просмотр
    depends_on:
      - task-003
    related_feature: Чтение новостей по интересам
    status: completed
    summary: "Подключен NewsAPI для загрузки финских новостей
      (top-headlines?country=fi) с фильтрацией по категориям пользователя.
      Реализованы: API-маршрут /api/news (app/api/news/route.ts), клиент NewsAPI
      (lib/newsapi.ts) с маппингом категорий, мок-данные для 7 категорий
      (lib/mock-data.ts). Компонент NewspaperClippings переписан на
      интерактивные карточки-вырезки с заголовком, источником и кратким
      содержанием. При клике открывается Dialog с полным текстом, датой и
      ссылкой на оригинал. Серверный фетчинг новостей в app/page.tsx с учётом
      настроек пользователя."
  - id: task-005
    phase: mvp
    title: Выделение и сохранение слов из новостей
    description:
      При открытии новости приложение выделяет ключевые финские слова,
      показывает их перевод на русский/английский. Пользователь может добавить
      слово в личный словарь одним кликом. Словарь сохраняется в DynamoDB.
    priority: high
    acceptance_criteria:
      - Ключевые слова из новости выделены и показаны с переводом
      - Пользователь может добавить слово в словарь одним кликом
      - В личном словаре отображаются все сохранённые слова с переводом
      - Можно удалять слова из словаря
    depends_on:
      - task-004
    related_feature: Изучение слов из новостей
    status: completed
    summary: Реализовано выделение финских слов из текста новости с переводом на
      русский/английский (lib/dictionary.ts, 250+ слов). Компонент
      WordHighlighter (components/word-highlighter.tsx) показывает слова в
      диалоге новости с кнопкой добавления в словарь одним кликом. Словарь
      пользователя сохраняется в DynamoDB (таблица vocabulary, CRUD в
      lib/models.ts, API /api/vocabulary). Страница /vocabulary
      (components/vocabulary-page.tsx) отображает все сохранённые слова с
      возможностью удаления. Ссылка на словарь добавлена в шапку.
  - id: task-006
    phase: mvp
    title: Диалог с ИИ-бабушкой
    description: После прочтения новости доступна кнопка «Обсудить с бабушкой».
      Бабушка (OpenAI API) начинает диалог на финском, используя контекст
      новости и новые слова. Пользователь может ответить, подсмотреть перевод
      сообщения бабушки или попросить подсказку для ответа. Диалог сохраняется в
      истории.
    priority: high
    acceptance_criteria:
      - После прочтения новости доступна кнопка «Обсудить с бабушкой»
      - Бабушка начинает диалог на финском с контекстом новости
      - Пользователь может ответить на финском
      - Доступна подсказка с переводом сообщения бабушки
      - Доступна кнопка «помочь с ответом»
      - Диалог сохраняется в истории
    depends_on:
      - task-005
    related_feature: Диалог с ИИ-бабушкой
    status: completed
    summary: "Реализован диалог с ИИ-бабушкой (Mummo). Созданы: таблицы
      chat_sessions и chat_messages в DynamoDB (lib/schema.ts), модели CRUD
      (lib/models.ts), OpenAI-клиент с мок-фолбэком (lib/openai.ts), API-роуты
      /api/chat, /api/chat/translate, /api/chat/hint. Компонент ChatDialog
      (components/chat-dialog.tsx) — UI диалога с полем ввода, переводом и
      подсказками. Кнопка «Keskustele mummon kanssa» добавлена в диалог новости
      (components/newspaper-clippings.tsx). Без OpenAI API ключа используются
      мок-ответы на финском с переводом."
  - id: task-007
    phase: mvp
    title: Ежедневные стрики
    description:
      Реализовать систему ежедневных стриков. Если пользователь выполняет
      хотя бы одно действие в день (читает новость, учит слово или общается с
      бабушкой), стрик растёт. При пропуске дня стрик сбрасывается. Стрик
      отображается на главном экране и сохраняется в базе.
    priority: medium
    acceptance_criteria:
      - Стрик отображается на главном экране
      - При ежедневном занятии стрик увеличивается на 1
      - При пропуске дня стрик сбрасывается до 0
      - Текущий стрик сохраняется в базе данных
    depends_on:
      - task-002
    related_feature: Ежедневные стрики
    status: completed
    summary:
      Добавлена LocalStorage-персистентность для ежедневных стриков. Создан
      lib/local-streak.ts с функциями
      getLocalStreak/saveLocalStreak/clearLocalStreak. StreakDisplay и
      StatsPanel читают localStorage при инициализации для мгновенного
      отображения, затем синхронизируются с API. Все 4 точки инкремента стрика
      (NewsCatalog, ChatDialog, NewspaperClippings, WordHighlighter) сохраняют
      ответ POST /api/streak в localStorage. typecheck/lint/build пройдены.
  - id: task-008
    phase: mvp
    title: Статистика пользователя
    description: "Создать страницу или боковую панель со статистикой: количество
      выученных слов, количество прочитанных новостей, длительность текущего
      стрика, общее время занятий. Данные обновляются в реальном времени и
      привязаны к аккаунту."
    priority: medium
    acceptance_criteria:
      - Статистика отображается на отдельной странице или в боковой панели
      - Данные обновляются в реальном времени
      - Все показатели привязаны к аккаунту пользователя
    depends_on:
      - task-005
      - task-007
    related_feature: Статистика пользователя
    status: completed
    summary:
      "Создана страница /stats со статистикой: количество выученных слов (из
      vocabulary), прочитанных новостей (счётчик в user_stats), текущий стрик
      (из user_streaks), общее время занятий (с таймером тренировки). Добавлена
      таблица user_stats в DynamoDB, API /api/stats (GET/POST), клиентский
      компонент StatsContent с автообновлением каждые 30 сек. Ссылка на
      статистику добавлена в шапку (BarChart3). Счётчик новостей инкрементится
      при открытии диалога новости."
  - id: task-009
    phase: mvp
    title: Настройка проекта и базы данных
    description: Создать новый Next.js проект с App Router, настроить Supabase
      (клиент, аутентификация, SQL-миграции для всех таблиц), Tailwind,
      shadcn/ui. Подготовить .env.local.example со всеми переменными.
    priority: high
    acceptance_criteria:
      - Next.js проект запускается и отображает страницу
      - Supabase клиент настроен и подключается
      - SQL-миграции создают все таблицы
      - Файл .env.local.example содержит все переменные
    depends_on: []
    related_feature: Чтение новостей по интересам
    status: completed
    summary:
      Next.js проект настроен и работает (проверен build, lint, typecheck,
      dev server на порту 8080). Supabase-клиенты (серверный и браузерный)
      созданы в lib/supabase.ts и lib/supabase-client.ts, middleware
      аутентификации настроен. SQL-миграции для 6 таблиц (user_preferences,
      vocabulary, chat_sessions, chat_messages, user_streaks, user_stats)
      созданы в supabase/migrations/ с RLS-политиками. Создан скрипт миграции
      scripts/migrate-supabase.ts и .env.local.example со всеми переменными.
  - id: task-010
    phase: mvp
    title: Конфигурация языков и бабушек
    description:
      "Создать конфигурационный файл с тремя языками (финский, сербский,
      грузинский) и тремя бабушками (Мария, Гроздана, Кетеван) с их полными
      профилями: биография, семья, речевой портрет, обращения, междометия,
      ключевые темы."
    priority: high
    acceptance_criteria:
      - Конфиг содержит 3 языка с флагами и кодами
      - Каждая бабушка имеет полный профиль
      - Добавление нового языка = новый объект в конфиге
      - Конфиг используется всеми компонентами
    depends_on:
      - task-009
    related_feature: Чтение новостей по интересам
    status: completed
    summary:
      "Создан конфигурационный файл lib/config.ts с типами LanguageConfig,
      GrandmaProfile, FamilyMember, SpeechPortrait. Добавлены 3 языка: финский
      (fi, 🇫🇮), сербский (sr, 🇷🇸), грузинский (ka, 🇬🇪) и 3 бабушки: Мария
      (Хельсинки), Гроздана (Белград), Кетеван (Тбилиси) — каждая с биографией,
      семьёй, речевым портретом, обращениями, междометиями, ключевыми темами и
      отсылками. Добавлены хелперы getLanguageByCode, getGrandmaById,
      getDefaultLanguage. Все проверки пройдены (typecheck, lint, build)."
  - id: task-011
    phase: mvp
    title: Главная страница — комната бабушки с антуражем по времени суток
    description:
      "Создать главный экран приложения: слева (30%) — спрайт бабушки, по
      центру (50%) — контент (новости/диалог), справа вверху — стрик и
      статистика. Комната меняет фон в зависимости от времени суток
      (утро/день/вечер/ночь). Ночью бабушка сонная."
    priority: high
    acceptance_criteria:
      - Главная страница имеет трёхколоночную структуру
      - Фон комнаты меняется по времени суток
      - Для каждой страны свой набор фонов
      - Ночью отображается сообщение «Ой, ты чего не спишь?»
      - Фоны можно заменить PNG в public/assets
    depends_on:
      - task-010
    related_feature: Смена антуража (комнаты) по времени суток
    status: completed
    summary:
      "Главная страница переработана в трёхколоночную структуру: слева (30%)
      — спрайт бабушки (GrandmaSprite), по центру (50%) — новости/диалог, справа
      (20%) — стрик и статистика (StatsPanel). Фон комнаты меняется в
      зависимости от времени суток (утро/день/вечер/ночь) через CSS-градиенты с
      возможностью замены на PNG в
      public/assets/backgrounds/{country}/{timeOfDay}.png. Для каждой из трёх
      стран (fi/sr/ka) свой набор фонов. В ночное время бабушка сонная (закрыты
      глаза, зевок, Zzz) и отображается сообщение «Ой, ты чего не спишь?».
      Основная реализация: lib/room-config.ts, components/room-scene.tsx,
      components/grandma-sprite.tsx, components/stats-panel.tsx,
      components/night-message.tsx."
  - id: task-012
    phase: mvp
    title: Аутентификация пользователей
    description:
      Добавить регистрацию и вход через Supabase Auth (email/password +
      магическая ссылка). Страница входа с формой. Неавторизованные пользователи
      видят только страницу входа.
    priority: high
    acceptance_criteria:
      - Регистрация с email и паролем
      - Вход по магической ссылке
      - Выход из аккаунта
      - Неавторизованный пользователь перенаправляется на /login
    depends_on:
      - task-009
    related_feature: Чтение новостей по интересам
    status: completed
    summary: "Добавлен вход по магической ссылке через Supabase Auth. Созданы:
      /api/auth/magic-link (POST) для отправки ссылки на email,
      /api/auth/callback (GET) для обработки редиректа с кодом подтверждения.
      Обновлена форма входа (components/login-form.tsx): добавлена кнопка «Войти
      по магической ссылке», после отправки показывается сообщение о проверке
      почты. Регистрация/вход по паролю и выход из аккаунта уже были реализованы
      в task-002. Middleware защищает все роуты, кроме /login и /api/auth."
  - id: task-013
    phase: mvp
    title: Выбор языка и настройка тем новостей
    description: "Добавить возможность выбора изучаемого языка
      (финский/сербский/грузинский) и настройку категорий новостей (только
      безопасные: culture, entertainment, lifestyle, science, technology,
      health, education, sports). Выбор сохраняется в Supabase."
    priority: high
    acceptance_criteria:
      - Пользователь может выбрать язык из трёх
      - Категории новостей — только безопасные (без политики)
      - Выбор сохраняется в Supabase
      - При повторном входе настройки восстанавливаются
    depends_on:
      - task-012
      - task-010
    related_feature: Настройка тем новостей
    status: completed
    summary:
      "Добавлен выбор изучаемого языка (финский/сербский/грузинский) через
      RadioGroup на странице /settings. Категории новостей заменены на
      безопасные (culture, entertainment, lifestyle, science, technology,
      health, education, sports). Выбор сохраняется в Supabase (таблица
      user_preferences с колонками language, categories) через API
      /api/preferences. При повторном входе настройки восстанавливаются из
      Supabase. Реализация: components/settings-form.tsx,
      app/api/preferences/route.ts, lib/constants.ts,
      supabase/migrations/001_create_user_preferences.sql."
  - id: task-014
    phase: mvp
    title: Загрузка и отображение новостей из NewsAPI с мок-фолбэком
    description: Подключить NewsAPI для загрузки новостей по выбранной стране и
      языку. Только безопасные категории. Новости отображаются как карточки с
      заголовком и кратким содержанием. При клике — подробный просмотр. Если API
      недоступен — мок-новости.
    priority: high
    acceptance_criteria:
      - Новости подгружаются из NewsAPI по стране и языку
      - Категории ограничены безопасными
      - Каждая новость — карточка с заголовком и содержанием
      - При клике открывается подробный просмотр
      - Без API-ключа — мок-новости
    depends_on:
      - task-013
    related_feature: Чтение новостей по интересам
    status: completed
    summary:
      Подключен NewsAPI для загрузки новостей по стране и языку (fi/sr/ka)
      через fetchNewsFromNewsAPI (lib/newsapi.ts). Категории ограничены
      безопасными (culture, entertainment, lifestyle, science, technology,
      health, education, sports). Добавлен компонент NewsCatalog
      (components/news-catalog.tsx) — карточки с заголовком, источником,
      категорией и содержанием, при клике Dialog с полным текстом,
      WordHighlighter и кнопкой обсуждения с бабушкой. Добавлены мок-новости для
      всех 3 языков (lib/mock-data.ts, getMockNews). API- роут /api/news с
      фолбэком на мок-данные при отсутствии NEWSAPI_KEY.
  - id: task-015
    phase: mvp
